services:
  mariadb:
    image: mariadb:11.8
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - exchangenet

  exchangetrack:
    build: .
    container_name: exchangetrack
    restart: no
    env_file:
      - .env
    networks:
      - exchangenet
    depends_on:
      - mariadb

networks:
  exchangenet:
    driver: bridge
    name: exchangenet

volumes:
  mariadb_data:
